<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>联系 — 矩空间摄影</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #fff;
    color: #111;
}

body {
    overflow-x: hidden;
}


/* =========================
   HEADER
   ========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 90px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: #fff;

    z-index: 1000;
}


/* =========================
   LOGO
   ========================= */

.logo a {

    display: block;

    text-decoration: none;

    color: #111;
}

.logo-cn {

    font-family:
        "LiSu",
        "隶书",
        "STLiti",
        "FZLiShu-S01",
        serif;

    font-size: 34px;

    letter-spacing: 7px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;
}

.logo-en {

    margin-top: 8px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    letter-spacing: 2.1px;

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;
}


/* =========================
   NAVIGATION
   ========================= */

nav {

    display: flex;

    align-items: center;

    gap: 45px;
}

.nav-item {

    display: block;

    text-decoration: none;

    color: #111;

    text-align: center;

    width: max-content;
}

.nav-cn {

    display: block;

    font-size: 17px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}

.nav-en {

    display: block;

    margin-top: 7px;

    font-size: 10px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}

.nav-item:hover {

    opacity: 0.5;
}


/* =========================
   CONTACT PAGE
   ========================= */

.contact-page {

    width: 100%;

    min-height: 100vh;

    padding-top: 155px;

    padding-left: 35px;

    padding-right: 35px;

    padding-bottom: 100px;

    display: grid;

    grid-template-columns: 40% 60%;

    align-items: start;
}


/* =========================
   LEFT
   CONTACT INFORMATION
   ========================= */

.contact-info {

    width: 100%;

    padding-right: 30px;

    text-align: left;
}


/* =========================
   CONTACT ITEM
   ========================= */

.contact-item {

    margin-bottom: 45px;

    text-align: left;
}


/* =========================
   LABEL
   ========================= */

.contact-label {

    font-size: 18px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1.3;

    margin-bottom: 12px;

    text-align: left;
}


/* =========================
   VALUE
   ========================= */

.contact-value {

    font-size: 15px;

    letter-spacing: 0.5px;

    line-height: 1.9;

    font-weight: 400;

    text-align: left;
}

.contact-value a {

    color: #111;

    text-decoration: none;
}

.contact-value a:hover {

    opacity: 0.5;
}


/* =========================
   SERVICE NOTES
   ========================= */

.contact-notes {

    margin-top: 85px;

    font-size: 12px;

    line-height: 1.9;

    letter-spacing: 0.2px;

    color: #777;

    text-align: left;
}

.contact-notes p {

    margin-bottom: 5px;
}


/* =========================
   RIGHT
   INQUIRY FORM
   ========================= */

.contact-form-area {

    width: 100%;

    padding-left: 30px;

    padding-right: 0;

    text-align: left;
}


/* =========================
   FORM TITLE
   ========================= */

.form-title {

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        Helvetica,
        sans-serif;

    text-align: left;

    margin-bottom: 45px;
}


/* CHINESE TITLE */

.form-title-cn {

    font-size: 18px;

    letter-spacing: 1px;

    font-weight: 500;

    line-height: 1.5;
}


/* ENGLISH TITLE */

.form-title-en {

    margin-top: 8px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    letter-spacing: 2px;

    font-weight: 700;

    line-height: 1.3;
}


/* =========================
   FORM
   ========================= */

.contact-form {

    width: 100%;

    max-width: 700px;

    text-align: left;
}


/* =========================
   FORM GROUP
   ========================= */

.form-group {

    width: 100%;

    margin-bottom: 28px;
}


/* =========================
   FORM LABEL
   ========================= */

.form-group label {

    display: block;

    font-size: 12px;

    letter-spacing: 1.5px;

    font-weight: 700;

    margin-bottom: 9px;

    line-height: 1.3;
}


/* =========================
   INPUT
   ========================= */

.form-group input,
.form-group select,
.form-group textarea {

    display: block;

    width: 100%;

    border: none;

    border-bottom: 1px solid #bbb;

    border-radius: 0;

    background: transparent;

    color: #111;

    font-family:
        Arial,
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-size: 14px;

    letter-spacing: 0.3px;

    outline: none;
}


/* INPUT */

.form-group input,
.form-group select {

    height: 40px;

    padding: 0;
}


/* TEXTAREA */

.form-group textarea {

    height: 100px;

    padding: 10px 0;

    resize: vertical;

    line-height: 1.7;
}


/* FOCUS */

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    border-bottom: 1px solid #111;
}


/* =========================
   SELECT
   ========================= */

.form-group select {

    cursor: pointer;

    appearance: auto;
}


/* =========================
   SUBMIT BUTTON
   ========================= */

.submit-button {

    margin-top: 12px;

    padding: 11px 25px;

    border: 1px solid #111;

    background: #111;

    color: #fff;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        Helvetica,
        sans-serif;

    font-size: 12px;

    letter-spacing: 1px;

    font-weight: 500;

    cursor: pointer;

    transition: all 0.2s ease;
}

.submit-button:hover {

    background: #fff;

    color: #111;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 800px) {

    header {

        height: 78px;

        padding: 0 18px;
    }


    .logo-cn {

        font-size: 25px;

        letter-spacing: 4px;
    }


    .logo-en {

        margin-top: 6px;

        font-size: 8px;

        letter-spacing: 1.3px;
    }


    nav {

        gap: 16px;
    }


    .nav-cn {

        font-size: 11px;

        letter-spacing: 0.5px;
    }


    .nav-en {

        margin-top: 4px;

        font-size: 6px;

        letter-spacing: 0.7px;
    }


    /* =====================
       CONTACT MOBILE
       ===================== */

    .contact-page {

        display: block;

        padding-top: 110px;

        padding-left: 20px;

        padding-right: 20px;

        padding-bottom: 60px;
    }


    /* CONTACT INFORMATION */

    .contact-info {

        width: 100%;

        padding-right: 0;

        margin-bottom: 65px;
    }


    .contact-item {

        margin-bottom: 35px;
    }


    .contact-label {

        font-size: 16px;

        margin-bottom: 9px;
    }


    .contact-value {

        font-size: 14px;

        line-height: 1.8;
    }


    /* SERVICE NOTES */

    .contact-notes {

        margin-top: 55px;

        font-size: 11px;

        line-height: 1.8;
    }


    .contact-notes p {

        margin-bottom: 5px;
    }


    /* FORM */

    .contact-form-area {

        width: 100%;

        padding-left: 0;

        padding-right: 0;
    }


    .form-title {

        margin-bottom: 35px;
    }


    .form-title-cn {

        font-size: 16px;

        line-height: 1.6;
    }


    .form-title-en {

        margin-top: 6px;

        font-size: 9px;

        letter-spacing: 1.5px;
    }


    .contact-form {

        width: 100%;

        max-width: none;
    }


    .form-group {

        margin-bottom: 25px;
    }


    .form-group label {

        font-size: 11px;

        margin-bottom: 8px;
    }


    .form-group input,
    .form-group select {

        height: 38px;

        font-size: 14px;
    }


    .form-group textarea {

        height: 110px;
    }


    .submit-button {

        margin-top: 10px;

        padding: 11px 25px;

        font-size: 12px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>


    <div class="logo">

        <a href="index.html">

            <div class="logo-cn">
                矩空间摄影
            </div>

            <div class="logo-en">
                Gnomon Space Photography
            </div>

        </a>

    </div>


    <nav>


        <a
            class="nav-item"
            href="projects.html"
        >

            <div class="nav-cn">
                酒店 / 民宿 / 建筑
            </div>

            <div class="nav-en">
                COMMERCIAL SPACE
            </div>

        </a>


        <a
            class="nav-item"
            href="about.html"
        >

            <div class="nav-cn">
                关于
            </div>

            <div class="nav-en">
                ABOUT
            </div>

        </a>


        <a
            class="nav-item"
            href="contact.html"
        >

            <div class="nav-cn">
                联系
            </div>

            <div class="nav-en">
                CONTACT
            </div>

        </a>


    </nav>

</header>



<!-- =========================
     CONTACT
     ========================= -->

<main class="contact-page">


    <!-- =====================
         LEFT
         ===================== -->

    <section class="contact-info">


        <!-- PHONE -->

        <div class="contact-item">

            <div class="contact-label">
                电话 / PHONE
            </div>

            <div class="contact-value">

                <a href="tel:+8617748489814">
                    177 4848 9814
                </a>

                <br>

                <a href="tel:+8615652752675">
                    156 5275 2675
                </a>

            </div>

        </div>


        <!-- WECHAT -->

        <div class="contact-item">

            <div class="contact-label">
                微信 / WECHAT
            </div>

            <div class="contact-value">
                sxcfoto
            </div>

        </div>


        <!-- SERVICE NOTES -->

        <div class="contact-notes">

            <p>
                * 基于成都、重庆，可承接全国项目拍摄
            </p>

            <p>
                * 报价包含基础商用授权；交付周期5-7个工作日
            </p>

            <p>
                * 档期以定金锁定，欢迎提前咨询档期
            </p>

        </div>


    </section>



    <!-- =====================
         RIGHT
         ===================== -->

    <section class="contact-form-area">


        <!-- FORM TITLE -->

        <div class="form-title">

            <div class="form-title-cn">
                请填写项目信息，稍后与您联系
            </div>

            <div class="form-title-en">
                PROJECT INQUIRY
            </div>

        </div>



        <!-- FORM -->

        <form
            class="contact-form"
            action="https://forminit.com/f/y04808d9grl"
            method="POST"
        >


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    NAME / 姓名
                </label>

                <input
                    type="text"
                    id="name"
                    name="fi-sender-fullName"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    PHONE / 电话
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="fi-text-phone"
                    required
                >

            </div>


            <!-- PROJECT -->

            <div class="form-group">

                <label for="project">
                    PROJECT / 项目类型
                </label>

                <select
                    id="project"
                    name="fi-select-project"
                    required
                >

                    <option
                        value=""
                        selected
                        disabled
                    >
                        请选择
                    </option>

                    <option value="Hotel">
                        HOTEL / 酒店
                    </option>

                    <option value="Boutique Guesthouse">
                        BOUTIQUE GUESTHOUSE / 民宿
                    </option>

                    <option value="Architecture">
                        ARCHITECTURE / 建筑
                    </option>

                    <option value="Restaurant">
                        RESTAURANT / 餐厅
                    </option>

                    <option value="Art Space">
                        ART SPACE / 艺术空间
                    </option>

                    <option value="Other">
                        OTHER / 其他
                    </option>

                </select>

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="location">
                    LOCATION / 项目地点
                </label>

                <input
                    type="text"
                    id="location"
                    name="fi-text-location"
                    required
                >

            </div>


            <!-- MESSAGE -->

            <div class="form-group">

                <label for="message">
                    MESSAGE / 项目需求
                </label>

                <textarea
                    id="message"
                    name="fi-text-message"
                    required
                ></textarea>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-button"
            >
                提交
            </button>


        </form>


    </section>


</main>


</body>

</html>
