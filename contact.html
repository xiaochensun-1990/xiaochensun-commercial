<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>联系 — 矩空间摄影</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #fff;
    color: #111;
}

body {
    overflow-x: hidden;
}


/* =========================
   HEADER
   ========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 90px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: #fff;

    z-index: 1000;
}


/* =========================
   LOGO
   ========================= */

.logo a {

    display: block;

    text-decoration: none;

    color: #111;
}

.logo-cn {

    font-family:
        "LiSu",
        "隶书",
        "STLiti",
        "FZLiShu-S01",
        serif;

    font-size: 34px;

    letter-spacing: 7px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;
}

.logo-en {

    margin-top: 8px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    letter-spacing: 2.1px;

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;
}


/* =========================
   NAVIGATION
   ========================= */

nav {

    display: flex;

    align-items: center;

    gap: 45px;
}

.nav-item {

    display: block;

    text-decoration: none;

    color: #111;

    text-align: center;

    width: max-content;
}

.nav-cn {

    display: block;

    font-size: 17px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}

.nav-en {

    display: block;

    margin-top: 7px;

    font-size: 10px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}

.nav-item:hover {
    opacity: 0.5;
}


/* =========================
   CONTACT PAGE
   ========================= */

.contact-page {

    min-height: 100vh;

    padding-top: 165px;

    padding-left: 35px;
    padding-right: 35px;

    display: flex;

    justify-content: flex-end;
}

.contact-content {

    width: 55%;

    max-width: 700px;

    padding-right: 70px;

    text-align: left;
}


/* =========================
   CONTACT ITEM
   ========================= */

.contact-item {

    margin-bottom: 55px;
}


/* =========================
   LABEL
   ========================= */

.contact-label {

    font-size: 22px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1.3;

    margin-bottom: 15px;
}


/* =========================
   VALUE
   ========================= */

.contact-value {

    font-size: 15px;

    letter-spacing: 0.5px;

    line-height: 1.9;

    font-weight: 400;
}

.contact-value a {

    color: #111;

    text-decoration: none;
}

.contact-value a:hover {

    opacity: 0.5;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    header {

        height: 78px;

        padding: 0 18px;
    }


    .logo-cn {

        font-size: 25px;

        letter-spacing: 4px;
    }


    .logo-en {

        margin-top: 6px;

        font-size: 8px;

        letter-spacing: 1.3px;
    }


    nav {

        gap: 16px;
    }


    .nav-cn {

        font-size: 11px;

        letter-spacing: 0.5px;
    }


    .nav-en {

        margin-top: 4px;

        font-size: 6px;

        letter-spacing: 0.7px;
    }


    .contact-page {

        padding-top: 125px;

        padding-left: 25px;

        padding-right: 25px;

        justify-content: flex-start;
    }


    .contact-content {

        width: 100%;

        max-width: none;

        padding-right: 0;
    }


    .contact-item {

        margin-bottom: 42px;
    }


    .contact-label {

        font-size: 18px;

        letter-spacing: 1px;

        margin-bottom: 10px;
    }


    .contact-value {

        font-size: 14px;

        line-height: 1.8;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>


    <div class="logo">

            <div class="logo-cn">

            </div>

    <nav>

            </div>

        </a>


        <a

        >

            <div class="nav-cn">
                关于
            </div>

            <div class="nav-en">
                ABOUT
            </div>

        </a>


        <a
            class="nav-item"
            href="contact.html"
        >

            <div class="nav-cn">
                联系
            </div>

            <div class="nav-en">
                CONTACT
            </div>

        </a>


    </nav>

</header>



<!-- =========================
     CONTACT
     ========================= -->

<main class="contact-page">


    <div class="contact-content">


        <!-- PHONE -->

        <div class="contact-item">

            <div class="contact-label">
                电话 / PHONE
            </div>

            <div class="contact-value">

                <a href="tel:+8617748489814">
                    177 4848 9814
                </a>

                <br>

                <a href="tel:+8615652752675">
                    156 5275 2675
                </a>

            </div>

        </div>



        <!-- WECHAT -->

        <div class="contact-item">

            <div class="contact-label">
                微信 / WECHAT
            </div>

            <div class="contact-value">
                sxcfoto
            </div>

        </div>



        <!-- EMAIL -->

        <div class="contact-item">

            <div class="contact-label">
                邮箱 / EMAIL
            </div>

            <div class="contact-value">

                <a href="mailto:photo_1990@163.com">
                    photo_1990@163.com
                </a>

            </div>

        </div>


    </div>


</main>


</body>

</html>
