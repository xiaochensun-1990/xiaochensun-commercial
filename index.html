<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>矩空间摄影 — Gnomon Space Photography</title>


<style>

/* =========================
   BASIC
   ========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #fff;
    color: #111;
}

body {
    overflow-x: hidden;
}


/* =========================
   HEADER
   ========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: #fff;

    z-index: 1000;
}


/* =========================
   LOGO
   ========================= */

.logo a {

    display: block;

    text-decoration: none;

    color: #111;
}

.logo-cn {

    font-size: 18px;

    letter-spacing: 1px;

    font-weight: 500;

    line-height: 1.1;
}

.logo-en {

    margin-top: 4px;

    font-size: 9px;

    letter-spacing: 0.8px;

    font-weight: 400;

    line-height: 1;
}


/* =========================
   NAVIGATION
   ========================= */

nav {

    display: flex;

    gap: 30px;
}

nav a {

    text-decoration: none;

    color: #111;

    font-size: 13px;

    letter-spacing: 1px;
}

nav a:hover {

    opacity: 0.5;
}


/* =========================
   HERO
   ========================= */

.hero {

    width: 100%;

    height: 100vh;

    padding-top: 70px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.hero img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    header {

        height: 60px;

        padding: 0 20px;
    }


    /* LOGO */

    .logo-cn {

        font-size: 15px;
    }

    .logo-en {

        margin-top: 3px;

        font-size: 8px;

        letter-spacing: 0.6px;
    }


    /* NAVIGATION */

    nav {

        gap: 15px;
    }

    nav a {

        font-size: 11px;

        letter-spacing: 0.8px;
    }


    /* HERO */

    .hero {

        padding-top: 60px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>


    <!-- LOGO -->

    <div class="logo">

        <a href="index.html">

            <div class="logo-cn">
                矩空间摄影
            </div>

            <div class="logo-en">
                Gnomon Space Photography
            </div>

        </a>

    </div>


    <!-- NAVIGATION -->

    <nav>

        <a href="projects.html">
            PROJECTS
        </a>

        <a href="about.html">
            ABOUT
        </a>

        <a href="contact.html">
            CONTACT
        </a>

    </nav>


</header>



<!-- =========================
     HERO IMAGE
     ========================= -->

<section class="hero">

    <img
        src="Home.JPG"
        alt="Gnomon Space Photography"
    >

</section>


</body>

</html>
