<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>矩空间摄影 — Gnomon Space Photography</title>


<style>

/* =========================
   BASIC
   ========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #fff;
    color: #111;
}

body {
    overflow-x: hidden;
}


/* =========================
   HEADER
   ========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 90px;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    padding: 18px 35px;

    background: #fff;

    z-index: 1000;
}


/* =========================
   LOGO
   ========================= */

.logo a {

    display: block;

    text-decoration: none;

    color: #111;
}


/* Chinese brand */

.logo-cn {

    font-family:
        "STKaiti",
        "KaiTi",
        "Kaiti SC",
        "BiauKai",
        serif;

    font-size: 34px;

    letter-spacing: 7px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;
}


/* English subtitle */

.logo-en {

    margin-top: 7px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    letter-spacing: 2.1px;

    font-weight: 500;

    line-height: 1;

    white-space: nowrap;
}


/* =========================
   NAVIGATION
   ========================= */

nav {

    display: flex;

    align-items: flex-start;

    gap: 45px;
}


/* Navigation item */

.nav-item {

    display: block;

    text-decoration: none;

    color: #111;

    text-align: left;
}


/* Chinese navigation */

.nav-cn {

    font-size: 17px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;
}


/* English navigation */

.nav-en {

    margin-top: 7px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 10px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;
}


.nav-item:hover {

    opacity: 0.5;
}


/* =========================
   HERO
   ========================= */

.hero {

    width: 100%;

    height: 100vh;

    padding-top: 90px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.hero img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    header {

        height: 78px;

        padding: 13px 18px;
    }


    /* LOGO */

    .logo-cn {

        font-size: 25px;

        letter-spacing: 4px;
    }

    .logo-en {

        margin-top: 6px;

        font-size: 8px;

        letter-spacing: 1.3px;
    }


    /* NAVIGATION */

    nav {

        gap: 16px;
    }

    .nav-cn {

        font-size: 11px;

        letter-spacing: 0.5px;
    }

    .nav-en {

        margin-top: 4px;

        font-size: 6px;

        letter-spacing: 0.7px;
    }


    /* HERO */

    .hero {

        padding-top: 78px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>


    <!-- LOGO -->

    <div class="logo">

        <a href="index.html">

            <div class="logo-cn">
                矩空间摄影
            </div>

            <div class="logo-en">
                Gnomon Space Photography
            </div>

        </a>

    </div>



    <!-- NAVIGATION -->

    <nav>


        <!-- COMMERCIAL SPACE -->

        <a
            class="nav-item"
            href="projects.html"
        >

            <div class="nav-cn">
                酒店 / 民宿 / 建筑
            </div>

            <div class="nav-en">
                COMMERCIAL SPACE
            </div>

        </a>



        <!-- ABOUT -->

        <a
            class="nav-item"
            href="about.html"
        >

            <div class="nav-cn">
                关于
            </div>

            <div class="nav-en">
                ABOUT
            </div>

        </a>



        <!-- CONTACT -->

        <a
            class="nav-item"
            href="contact.html"
        >

            <div class="nav-cn">
                联系
            </div>

            <div class="nav-en">
                CONTACT
            </div>

        </a>


    </nav>


</header>



<!-- =========================
     HERO IMAGE
     ========================= -->

<section class="hero">

    <img
        src="Home.JPG"
        alt="Gnomon Space Photography"
    >

</section>


</body>

</html>
