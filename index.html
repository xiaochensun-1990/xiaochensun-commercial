<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XIAOCHEN SUN — Commercial Photography</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #111;
}

body {
    overflow-x: hidden;
}

/* =========================
   HEADER
   ========================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: #fff;
    z-index: 1000;
}

.logo {
    font-size: 18px;
    letter-spacing: 1px;
    font-weight: 500;
}

nav {
    display: flex;
    gap: 30px;
}

nav a {
    text-decoration: none;
    color: #111;
    font-size: 13px;
    letter-spacing: 1px;
}

/* =========================
   HERO
   ========================= */

.hero {
    width: 100%;
    height: 100vh;

    padding-top: 70px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    header {
        height: 60px;
        padding: 0 20px;
    }

    .logo {
        font-size: 15px;
    }

    nav {
        gap: 15px;
    }

    nav a {
        font-size: 11px;
    }

    .hero {
        padding-top: 60px;
    }

}

</style>
</head>


<body>

<header>

    <div class="logo">
        XIAOCHEN SUN
    </div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="projects.html">PROJECTS</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
    </nav>

</header>


<section class="hero">

    <img src="Home.JPG" alt="XIAOCHEN SUN Commercial Photography">

</section>


</body>
</html>
