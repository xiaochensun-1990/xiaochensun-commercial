<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>商业空间 — 矩空间摄影</title>


<style>

/* =========================
   BASIC
   ========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #fff;
    color: #111;
}

body {
    overflow-x: hidden;
}


/* =========================
   HEADER
   ========================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 90px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 35px;

    background: #fff;

    z-index: 1000;
}


/* =========================
   LOGO
   ========================= */

.logo a {

    display: block;

    text-decoration: none;

    color: #111;
}


.logo-cn {

    font-family:
        "LiSu",
        "隶书",
        "STLiti",
        "FZLiShu-S01",
        serif;

    font-size: 34px;

    letter-spacing: 7px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;
}


.logo-en {

    margin-top: 8px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    letter-spacing: 2.1px;

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;
}


/* =========================
   NAVIGATION
   ========================= */

nav {

    display: flex;

    align-items: center;

    gap: 45px;
}


.nav-item {

    display: block;

    text-decoration: none;

    color: #111;

    text-align: center;

    width: max-content;
}


.nav-cn {

    display: block;

    font-size: 17px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}


.nav-en {

    display: block;

    margin-top: 7px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 10px;

    letter-spacing: 1.5px;

    font-weight: 700;

    line-height: 1;

    text-align: center;

    white-space: nowrap;
}


.nav-item:hover {
    opacity: 0.5;
}


/* =========================
   PROJECTS AREA
   ========================= */

.projects {

    padding-top: 125px;

    padding-left: 35px;

    padding-right: 35px;

    padding-bottom: 60px;
}


/* =========================
   PROJECT GRID
   ========================= */

.project-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    column-gap: 25px;

    row-gap: 55px;
}


/* =========================
   PROJECT CARD
   ========================= */

.project {

    display: block;

    text-decoration: none;

    color: #111;
}


/* =========================
   PROJECT IMAGE
   ========================= */

.project-image {

    width: 100%;

    aspect-ratio: 3 / 2;

    overflow: hidden;

    background: #f2f2f2;
}


.project-image img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    transition:
        transform 0.5s ease;
}


/* =========================
   HOVER
   ========================= */

.project:hover img {

    transform: scale(1.025);
}


/* =========================
   PROJECT TITLE
   ========================= */

.project-title {

    margin-top: 13px;

    font-size: 14px;

    letter-spacing: 1px;

    font-weight: 500;

    text-align: left;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    header {

        height: 78px;

        padding: 0 18px;
    }


    .logo-cn {

        font-size: 25px;

        letter-spacing: 4px;
    }


    .logo-en {

        margin-top: 6px;

        font-size: 8px;

        letter-spacing: 1.3px;
    }


    nav {

        gap: 16px;
    }


    .nav-cn {

        font-size: 11px;

        letter-spacing: 0.5px;
    }


    .nav-en {

        margin-top: 4px;

        font-size: 6px;

        letter-spacing: 0.7px;
    }


    .projects {

        padding-top: 105px;

        padding-left: 18px;

        padding-right: 18px;
    }


    .project-grid {

        grid-template-columns: 1fr;

        row-gap: 40px;
    }


    .project-title {

        font-size: 12px;

        margin-top: 9px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>


    <!-- LOGO -->

    <div class="logo">

        <a href="index.html">

            <div class="logo-cn">
                矩空间摄影
            </div>

            <div class="logo-en">
                Gnomon Space Photography
            </div>

        </a>

    </div>


    <!-- NAVIGATION -->

    <nav>


        <a
            class="nav-item"
            href="projects.html"
        >

            <div class="nav-cn">
                酒店 / 民宿 / 建筑
            </div>

            <div class="nav-en">
                COMMERCIAL SPACE
            </div>

        </a>


        <a
            class="nav-item"
            href="about.html"
        >

            <div class="nav-cn">
                关于
            </div>

            <div class="nav-en">
                ABOUT
            </div>

        </a>


        <a
            class="nav-item"
            href="contact.html"
        >

            <div class="nav-cn">
                联系
            </div>

            <div class="nav-en">
                CONTACT
            </div>

        </a>

    </nav>

</header>



<!-- =========================
     PROJECTS
     ========================= -->

<main class="projects">


    <div class="project-grid">


        <!-- 01 重庆渝中酒店 -->

        <a

        >

            <div class="project-image">

                <img
                    src="/xiaochensun-commercial/chongqing-yuzhong-hotel/ayl-20.jpeg"
                    alt="重庆渝中酒店项目"
                >

            </div>

            <div class="project-title">
                重庆渝中酒店项目
            </div>

        </a>



        <!-- 02 千高原艺术空间 -->

        <a

        >

            <div class="project-image">

                <img
                    src="/xiaochensun-commercial/qgy-art-space/qgy-12.JPG"

                >

            </div>

            <div class="project-title">

            </div>

        </a>



        <!-- 03 青城前山民宿 -->

        <a

                    src="/xiaochensun-commercial/qingcheng-front-mountain/jjsj-12.jpeg"

            </div>

            <div class="project-title">

        </a>



        <!-- 04 青城山独栋民宿 -->

        <a

            <div class="project-image">

                <img
                    src="/xiaochensun-commercial/qingcheng-villa/xw-05.jpeg"

                >

            </div>

            </div>

        </a>



        <!-- 05 成都吴氏荟餐厅 -->

        <a
            class="project"

                <img
                    src="/xiaochensun-commercial/wushi-hui/wsh-02.jpeg"
                    alt="成都吴氏荟餐厅项目"
                >

            </div>

            <div class="project-title">

            </div>

        </a>



        <!-- 06 西岭花水湾 -->

        <a
            class="project"

        >

            <div class="project-image">

                <img
                    src="/xiaochensun-commercial/xiling-huashuiwan/xxl-06.jpeg"
                    alt="西岭花水湾独栋民宿"
                >

            </div>

            <div class="project-title">
                西岭花水湾独栋民宿
            </div>

        </a>


    </div>

</main>


</body>

</html>
